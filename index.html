<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>MindX SO — Đã chuyển trang</title>
  <meta http-equiv="refresh" content="0; url=https://somindx.com/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://somindx.com/">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #0b0d10; color: #e7eaed; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 520px; text-align: center; padding: 40px 32px; background: #14171c; border: 1px solid #2a2f37; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    h1 { font-size: 22px; margin: 0 0 12px; font-weight: 700; }
    p { font-size: 15px; line-height: 1.55; color: #b8bdc4; margin: 8px 0; }
    a { color: #ff5f57; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #2a2f37; border-top-color: #ff5f57; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="spinner"></span>Đang chuyển sang MindX SO</h1>
    <p>Trang này đã được tích hợp vào hệ thống chính.</p>
    <p>Nếu trình duyệt không tự chuyển, hãy bấm:<br><a href="https://somindx.com/">https://somindx.com/</a></p>
  </div>
  <script>
    window.location.replace("https://somindx.com/");
  </script>
</body>
</html>
